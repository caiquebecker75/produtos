<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta QR · 75 LAB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --lime: #C0EE4E; --lime-s: #EAFBC0; --ink: #0E1110; --ink2: #54594E; --ink3: #9AA08F; --paper: #F1F2EC; --anton: 'Anton', 'Impact', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Lexend', system-ui, sans-serif; font-weight: 300; padding: 24px 16px 48px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 28px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 820px) { .wrap { grid-template-columns: minmax(0, 440px) 1fr; gap: 48px; } }
  .etiqueta { background: #fff; border-radius: 24px; padding: 18px; }
  .etiqueta img { display: block; width: 100%; height: auto; border-radius: 10px; }
  .etiqueta.pequena img { width: auto; max-width: 100%; max-height: 62vh; margin: 0 auto; }
  .modelos { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 14px; }
  .modelos button { background: #F1F2EC; border: 0; border-radius: 20px; padding: 7px 13px; font-size: 12.5px; color: #54594E; cursor: pointer; font: inherit; font-size: 12.5px; }
  .modelos button.sel { background: #0E1110; color: #fff; }
  .modelos button small { display: block; font-size: 10.5px; opacity: .7; }
  .topo img { height: 36px; width: auto; }
  .eyebrow { font-family: var(--anton); font-size: 12px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--ink2); display: flex; gap: 10px; align-items: center; margin-top: 28px; }
  .eyebrow::before { content: ""; width: 22px; height: 2px; background: #A6D934; }
  h1 { font-weight: 200; text-transform: uppercase; font-size: clamp(32px, 5vw, 48px); line-height: .95; margin-top: 10px; letter-spacing: -.4px; }
  h1 b { font-weight: 600; display: block; }
  .info { margin-top: 14px; color: var(--ink2); font-size: 15px; line-height: 1.5; }
  .info b { color: var(--ink); font-weight: 500; }
  .acoes { display: grid; gap: 8px; margin-top: 26px; }
  .btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--ink); background: #fff; border: 0; border-radius: 14px; padding: 15px 18px; font: inherit; font-weight: 500; font-size: 15px; cursor: pointer; }
  .btn small { font-weight: 300; color: var(--ink3); font-size: 12.5px; }
  .btn.principal { background: var(--ink); color: var(--lime); font-family: var(--anton); font-weight: 400; letter-spacing: 1.4px; text-transform: uppercase; font-size: 16px; }
  .btn.principal small { color: #9AA08F; font-family: 'Lexend', sans-serif; letter-spacing: 0; text-transform: none; }
  .url { margin-top: 22px; font-size: 12.5px; color: var(--ink3); word-break: break-all; }
  .falta { background: #FFF1D6; border-radius: 16px; padding: 18px; font-size: 14px; line-height: 1.5; }
  .falta code { background: #fff; border-radius: 6px; padding: 2px 6px; font-size: 13px; }
  @media print {
    @page { size: 100mm 150mm; margin: 0; }
    body { padding: 0; background: #fff; }
    .lado, .topo-print { display: none !important; }
    .wrap { display: block; }
    .etiqueta { padding: 0; border-radius: 0; }
    .etiqueta img { width: 100mm; height: 150mm; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <figure class="etiqueta">
    <img id="img" alt="Etiqueta com o QR code da peça">
    <div class="falta" id="falta" hidden></div>
  </figure>
  <div class="lado">
    <div class="topo"><img src="../assets/img/logo-75lab-preto.png" alt="75 LAB" width="51" height="36"></div>
    <div class="eyebrow" id="eyebrow">Etiqueta QR · 10 × 15 cm</div>
    <h1 id="titulo">Etiqueta <b>da peça</b></h1>
    <div class="modelos" id="modelos"></div>
    <p class="info" id="info">Imprima e mande junto com a peça. Quem escanear vai precisar da <b>senha de acesso</b> definida no painel.</p>
    <div class="acoes">
      <button class="btn principal" id="imprimir" type="button">Imprimir <small>tamanho real 10 × 15 cm</small></button>
      <a class="btn" id="pdf" download>Baixar PDF <small>para a gráfica</small></a>
      <a class="btn" id="png" download>Baixar PNG <small>300 dpi</small></a>
      <a class="btn" id="qrpng" download>Só o QR code (PNG) <small>para a arte da embalagem</small></a>
      <a class="btn" id="qrsvg" download>Só o QR code (SVG) <small>vetor</small></a>
    </div>
    <p class="url" id="url"></p>
  </div>
</div>
<script type="module">
  import { db } from '../assets/base.js?v=1';
  const slug = (new URLSearchParams(location.search).get('p') || '').replace(/[^a-z0-9-]/g, '');
  const base = `../${slug}/qr/`;
  const img = document.getElementById('img');
  // cada modelo é um arquivo próprio em <pasta>/qr/. O sufixo '-livre' é a versão sem o passo da senha.
  const MODELOS = [
    { id: 'etiqueta',     nome: 'Completa',  medida: '10 × 15 cm', w: 100, h: 150, livre: true },
    { id: 'cartao-60x90', nome: 'Cartão',    medida: '6 × 9 cm',   w: 60,  h: 90,  livre: true },
    { id: 'selo-50',      nome: 'Selo',      medida: '5 × 5 cm',   w: 50,  h: 50 },
    { id: 'tira-70x30',   nome: 'Tira',      medida: '7 × 3 cm',   w: 70,  h: 30 },
    { id: 'mini-35',      nome: 'Mini',      medida: '3,5 × 3,5 cm', w: 35, h: 35 },
  ];
  let modelo = MODELOS[0];
  const figura = document.querySelector('.etiqueta');
  const estilo = document.createElement('style');
  document.head.appendChild(estilo);

  const aplicar = (sufixo) => {
    // o sufixo da senha só existe nos modelos que listam os passos
    const suf = modelo.livre ? sufixo : '';
    const nomes = { pdf: `${modelo.id}${suf}.pdf`, png: `${modelo.id}${suf}.png`, qrpng: 'qr-code.png', qrsvg: 'qr-code.svg' };
    Object.entries(nomes).forEach(([id, arq]) => {
      const a = document.getElementById(id);
      a.href = base + arq;
      a.setAttribute('download', `${slug}-${arq}`);
    });
    img.hidden = false;
    document.getElementById('falta').hidden = true;
    document.querySelectorAll('.acoes').forEach((el) => { el.hidden = false; });
    img.src = `${base}${modelo.id}${suf}.png?t=${Date.now()}`;
    figura.classList.toggle('pequena', modelo.id !== 'etiqueta');
    document.getElementById('eyebrow').textContent = `Etiqueta QR · ${modelo.medida}`;
    document.querySelector('#imprimir small').textContent = `tamanho real ${modelo.medida}`;
    estilo.textContent = `@media print { @page { size: ${modelo.w}mm ${modelo.h}mm; margin: 0 } .etiqueta img { width: ${modelo.w}mm !important; height: ${modelo.h}mm !important; max-height: none !important } }`;
  };

  document.getElementById('modelos').innerHTML = MODELOS
    .map((m, i) => `<button type="button" data-k="${i}" class="${i ? '' : 'sel'}">${m.nome}<small>${m.medida}</small></button>`).join('');
  document.getElementById('modelos').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    modelo = MODELOS[+b.dataset.k];
    document.querySelectorAll('#modelos button').forEach((x) => x.classList.toggle('sel', x === b));
    aplicar(livre ? '-livre' : '');
  });
  let livre = false;
  try {
    const { fs, db: banco } = await db();
    const snap = await fs.getDoc(fs.doc(banco, 'paginas', slug));
    livre = snap.exists() && snap.data().semSenha === true;
  } catch {}
  if (livre) {
    document.getElementById('info').innerHTML = 'Imprima e mande junto com a peça. Esta página está com <b>acesso livre</b> no painel: a etiqueta não tem o passo da senha.';
  }
  document.getElementById('url').textContent = `O QR abre: https://projetos.75lab.com.br/produtos/${slug}/?qr=1`;
  aplicar(livre ? '-livre' : '');
  img.onerror = () => {
    if (livre && img.src.includes('-livre')) return aplicar(''); // etiqueta sem senha ainda não gerada: mostra a padrão
    img.hidden = true;
    const f = document.getElementById('falta');
    f.innerHTML = slug
      ? `Este modelo ainda não foi gerado para esta peça. Rode <code>node tools/qr.mjs ${slug}</code> e <code>node tools/qr-modelos.mjs ${slug}</code> no repositório e publique.`
      : 'Nenhuma peça informada.';
    f.hidden = false;
    document.querySelectorAll('.acoes').forEach((el) => { el.hidden = true; });
  };
  document.getElementById('imprimir').addEventListener('click', () => window.print());
  fetch('../projetos.json', { cache: 'no-store' }).then((r) => r.json()).then((lista) => {
    const p = lista.find((x) => x.slug === slug);
    if (!p) return;
    document.title = `Etiqueta QR · ${p.nome}`;
    const esc = (t) => String(t || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const repete = p.nome.toLowerCase().includes((p.cliente || '').toLowerCase());
    document.getElementById('titulo').innerHTML = repete ? esc(p.nome) : `${esc(p.nome)} <b>${esc(p.cliente)}</b>`;
  }).catch(() => {});
</script>
</body>
</html>
